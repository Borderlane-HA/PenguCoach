# alpha.88: builds the public demo (static pages with made-up data) and publishes it
# on GitHub Pages: https://borderlane-ha.github.io/PenguCoach/
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node --test tests/demo.test.cjs
      - run: npm run build:demo
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
