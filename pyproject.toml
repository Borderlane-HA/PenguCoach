[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengucoach"
version = "0.1.0-alpha.25"
description = "Self-hosted AI training and health coach"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "argon2-cffi>=25,<26",
  "PyJWT>=2.10,<3",
  "cryptography>=45,<47",
  "garminconnect==0.3.16",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "fitdecode>=0.11,<1",
  "pandas>=2.3,<3",
  "pyarrow>=21,<22",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["pengucoach*", "apps.api*", "worker*"]
exclude = ["tests*", "docs*", "docker*", "install*", "db*"]
namespaces = true
